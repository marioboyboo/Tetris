<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canvas Game</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    canvas {
      border: 2px solid #333;
      background-color: #000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game state variable
    let gameState = 'PLAYING'; // 'PLAYING' or 'GAMEOVER'
    let score = 0;

    // Player object
    let player = {
      x: 100,
      y: 180,
      size: 30,
      color: '#4CAF50'
    };

    // Listen for keyboard input to restart or play
    window.addEventListener('keydown', (e) => {
      if (gameState === 'GAMEOVER' && e.code === 'Space') {
        resetGame();
      }
    });

    // Reset all variables to restart the game
    function resetGame() {
      score = 0;
      player.y = 180;
      gameState = 'PLAYING';
      requestAnimationFrame(gameLoop);
    }

    // Trigger Game Over state
    function triggerGameOver() {
      gameState = 'GAMEOVER';
    }

    // Render the transparent gray overlay and restart text box
    function drawGameOverScreen() {
      // 1. Transparent gray background overlay
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Center square/dialog box
      const boxWidth = 320;
      const boxHeight = 160;
      const boxX = (canvas.width - boxWidth) / 2;
      const boxY = (canvas.height - boxHeight) / 2;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      // 3. Text content
      ctx.textAlign = 'center';
      
      ctx.fillStyle = '#e74c3c';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('GAME OVER', canvas.width / 2, boxY + 50);

      ctx.fillStyle = '#333333';
      ctx.font = '16px sans-serif';
      ctx.fillText('Press SPACE to Restart', canvas.width / 2, boxY + 100);
    }

    // Main Game Loop
    function gameLoop() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'PLAYING') {
        // --- DRAW GAME OBJECTS ---
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.size, player.size);

        // --- GAME OVER DEMO TRIGGER ---
        // For testing: Click the canvas or wait 3 seconds to trigger game over
        // Replace this with your actual collision/death condition
      }

      // Render game over screen when state changes
      if (gameState === 'GAMEOVER') {
        drawGameOverScreen();
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    // Optional: Click canvas to trigger game over for testing
    canvas.addEventListener('click', () => {
      if (gameState === 'PLAYING') {
        triggerGameOver();
        gameLoop(); // Final frame to render overlay
      }
    });

    // Start the game loop
    gameLoop();
  </script>
</body>
</html>
